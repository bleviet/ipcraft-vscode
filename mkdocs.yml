site_name: IPCraft for VS Code
site_description: Visual editor for FPGA IP Core and Memory Map specifications
site_url: https://bleviet.github.io/ipcraft-vscode
site_author: Le Viet Bach
repo_url: https://github.com/bleviet/ipcraft-vscode
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Le Viet Bach

theme:
  name: material
  logo: images/ipcraft-logo.svg
  favicon: images/ipcraft-logo.svg
  font:
    text: Manrope
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark theme
  features:
    - navigation.sections
    - navigation.expand
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/bahonavi.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - tables
  - attr_list
  - toc:
      permalink: true

exclude_docs: |
  concepts/brainstorm/
  superpowers/

nav:
  - Home: index.html
  - Get started:
      - What IPCraft does: introduction/what-is-ipcraft.md
      - Install and first steps: introduction/install.md
      - Creating your first IP core: how-to/create-your-first-ip-core.md
  - User guide:
      - The specification:
          - IP Core editor: reference/ip-core-editor.md
          - Memory-mapped registers: tutorials/memory-mapped-registers.md
          - Custom interfaces: how-to/defining-a-custom-interface.md
          - Vivado interface catalog: concepts/vivado-interface-catalog.md
          - Functions in port widths: how-to/using-arithmetic-functions-in-port-widths.md
      - Import existing designs: how-to/importing-an-existing-design.md
      - Generate:
          - Generating a project: how-to/generating-a-project.md
          - Scaffold packs: how-to/customizing-generated-files-with-scaffold-packs.md
          - "Tutorial: build and verify a scaffold pack": tutorials/build-and-verify-a-scaffold-pack.md
          - Running a cocotb simulation: how-to/run-cocotb-simulation.md
          - Generating a vhdl_ls.toml: how-to/generate-vhdl-ls-config.md
      - Build and check:
          - Building a project: how-to/building-a-project.md
          - Checking consistency: how-to/check-consistency.md
      - System Viewer:
          - Viewing a system design: how-to/view-a-system-design.md
          - Rendering documentation images: how-to/render-documentation-images.md
      - Data Inspector:
          - Using the Data Inspector: how-to/use-data-inspector.md
          - How values are decoded: concepts/data-inspector.md
      - "Case study: DE10-Nano": tutorials/de10-nano-case-study.md
  - Reference:
      - Commands and settings: reference/commands.md
      - Keyboard shortcuts: reference/keyboard-shortcuts.md
      - Command line: reference/command-line.md
      - Generator: reference/generator.md
      - Generator feature coverage: concepts/generator-feature-coverage.md
      - Specification schemas: reference/specification-schemas.md
  - Developers:
      - Development setup: getting-started/development.md
      - Contributing guidelines: contributing/guidelines.md
      - Testing: testing.md
      - EDA integration tests:
          - How they work: concepts/eda-integration-tests.md
          - Running them: how-to/run-eda-integration-tests.md
      - Documentation screenshots: concepts/docs-screenshots.md
      - Building a VSIX: how-to/build-vsix.md
      - Architecture:
          - Overview: architecture/overview.md
          - Extension host: architecture/extension-host.md
          - Webviews: architecture/webview.md
          - Generator: architecture/generator-backbone.md
          - Bit-field handling: architecture/bit-field-handling.md
          - Bit-field developer reference: reference/bitfield-interaction.md
          - Spatial editing: concepts/spatial-editing.md
          - Responsive design: concepts/responsive-design.md
          - Port field metadata: concepts/port-fields.md
          - Diagram renderer: architecture/diagram-renderer.md
          - Clock and reset wires: concepts/clock-reset-wires.md
          - VSIX packaging: architecture/vsix-packaging.md
      - Developer changelog: contributing/changelog.md
