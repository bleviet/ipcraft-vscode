vlnv:
  vendor: ipcraft-examples
  library: peripherals
  name: regmap_conformance
  version: 1.0.0
apiVersion: '1.0'
scaffold_pack: example-with-docs
description: >
  Hardware register-conformance test IP (see
  docs/hardware-conformance-test-plan.md in this repo). Exercises all seven
  IPCraft field access types plus change-of-state, register arrays, byte
  strobes, mixed registers, and enumerated/non-zero-reset fields,
  self-checked via a software-writable STIMULUS loopback register.
targets:
  - quartus

clocks:
  - name: clk
    logicalName: CLK
    direction: in
    frequency: 50MHz
    description: System clock
    associatedReset: reset

resets:
  - name: reset
    logicalName: RESET
    direction: in
    polarity: activeHigh
    description: Synchronous reset
    associatedClock: clk

ports:
  - name: led
    direction: out
    width: 8
    description: >
      Board-only test-harness liveness indicator (see regmap_conformance.mm.yml
      TEST_PROGRESS). Bits [6:0] are a steady binary readout of
      TEST_PROGRESS.COUNT -- always lit, never blinked. Bit [7] is a
      dedicated status LED that blinks slowly while the shared conformance
      suite is progressing and faster once TEST_PROGRESS.FAILED is set.

interrupts:
  - name: irq_associated
    direction: out
    sensitivity: EDGE_RISING
    associatedBusInterface: S_AVMM
    associatedClock: clk
    description: >
      Pulses when STIMULUS.SAMPLE_EVT_TRIG rises. Explicitly associated with
      the Avalon-MM slave to verify the portable association path.
  - name: irq_no_bus
    direction: out
    sensitivity: LEVEL_HIGH
    associatedBusInterface: ""
    associatedClock: clk
    description: >
      Periodic level-sensitive interrupt with an explicitly empty bus
      association, used to verify interrupt-only components.

busInterfaces:
  - name: S_AVMM
    type: ipcraft:busif:avalon_mm:1.0
    mode: slave
    physicalPrefix: avs_
    associatedClock: clk
    associatedReset: reset
    memoryMapRef: REGMAP_CONFORMANCE_CSR
    useOptionalPorts:
      - read
      - write
      - writedata
      - readdata
      - address
      - byteenable
    portWidthOverrides:
      address: 5

memoryMaps:
  import: regmap_conformance.mm.yml

# NOTE: CocotbFramework derives the cocotb Makefile's *entire* VHDL_SOURCES
# list from this RTL_Sources fileSet once any fileSets are present at all
# (it does not merge with auto-discovered files) -- so this must be the
# complete RTL manifest, not just the file(s) being protected below.
# `managed: false` marks rtl/regmap_conformance_core.vhd, the cocotb
# scoreboard, shared manifest-driven scenarios, and DE10-Nano harness as
# user-owned so a re-scaffold never overwrites the hand-written behavior.
# Declaring every user-owned file also lets `ipcraft verify` distinguish the
# board harness from stale generated output.
fileSets:
  - name: RTL_Sources
    description: RTL Sources
    files:
      - path: rtl/regmap_conformance_pkg.vhd
        type: vhdl
      - path: rtl/regmap_conformance_regs.vhd
        type: vhdl
      - path: rtl/regmap_conformance_core.vhd
        type: vhdl
        managed: false
      - path: rtl/regmap_conformance_avmm.vhd
        type: vhdl
      - path: rtl/regmap_conformance.vhd
        type: vhdl
  - name: Simulation_Resources
    description: Simulation Files
    files:
      - path: tb/regmap_conformance_test.py
        type: python
        managed: false
      - path: tb/test_regmap_conformance_sim.py
        type: python
        managed: false
      - path: tb/conformance_scenarios.py
        type: python
        managed: false
      - path: tb/mm_loader.py
        type: python
        managed: false
  - name: Integration
    description: Integration Files
    files:
      - path: altera/regmap_conformance_hw.tcl
        type: tcl
      - path: altera/debug/hardware_runner.py
        type: python
        managed: false
      - path: altera/debug/verify_irq_metadata.py
        type: python
        managed: false
      - path: altera/debug/verify_irq_hardware.py
        type: python
        managed: false
      - path: altera/debug/conformance_sysconsole.tcl
        type: tcl
        managed: false
      - path: altera/hdl/de10_nano_top.vhd
        type: vhdl
        managed: false
      - path: altera/qsys/regmap_conformance_system.tcl
        type: tcl
        managed: false
      - path: altera/quartus/Makefile
        type: makefile
        managed: false
      - path: altera/quartus/de10_nano.sdc
        type: sdc
        managed: false
      - path: altera/quartus/de10_nano_pin_assignments.tcl
        type: tcl
        managed: false
      - path: altera/quartus/de10_nano_project.tcl
        type: tcl
        managed: false
  - name: Documentation
    description: User-maintained validation evidence
    files:
      - path: docs/hardware_validation_results.md
        type: markdown
        managed: false
