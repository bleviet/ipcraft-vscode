vlnv:
  vendor: ipcraft-examples
  library: peripherals
  name: regmap_conformance_axil
  version: 1.0.0
apiVersion: '1.0'
scaffold_pack: example-with-docs
description: >
  Hardware register-conformance test IP, AXI4-Lite variant (see
  docs/hardware-conformance-test-plan.md in this repo, Variant B). Same
  register map and STIMULUS loopback design as the
  examples/regmap_conformance_avmm Avalon-MM example, proving the AXI4-Lite
  wrapper on real hardware via a JTAG-to-Avalon-MM master and Platform
  Designer's Avalon<->AXI bridging -- no HPS/Nios II required.
targets:
  - quartus

clocks:
  - name: clk
    logicalName: CLK
    direction: in
    frequency: 50MHz
    description: System clock
    associatedReset: reset_n

resets:
  - name: reset_n
    logicalName: RESET_N
    direction: in
    polarity: activeLow
    description: Asynchronous reset, active low (AXI4-Lite convention)
    associatedClock: clk

ports:
  - name: led
    direction: out
    width: 8
    description: >
      Board-only test-harness liveness indicator (see regmap_conformance_axil.mm.yml
      TEST_PROGRESS). Bits [6:0] are a steady binary readout of
      TEST_PROGRESS.COUNT -- always lit, never blinked. Bit [7] is a
      dedicated status LED that blinks slowly while the shared conformance
      suite is progressing and faster once TEST_PROGRESS.FAILED is set.

busInterfaces:
  - name: S_AXI_LITE
    type: ipcraft:busif:axi4_lite:1.0
    mode: slave
    physicalPrefix: s_axil_
    associatedClock: clk
    associatedReset: reset_n
    memoryMapRef: REGMAP_CONFORMANCE_AXIL_CSR
    portWidthOverrides:
      AWADDR: 7
      ARADDR: 7
      WDATA: 32
      RDATA: 32
      WSTRB: 4

memoryMaps:
  import: regmap_conformance_axil.mm.yml

# `managed: false` marks rtl/regmap_conformance_axil_core.vhd, the cocotb
# scoreboard, the shared manifest-driven scenarios, and the JTAG-to-Avalon
# hardware runner as user-owned so a re-scaffold never overwrites the
# hand-written loopback wiring, the hand-added conformance assertions, or the
# board transport used by both simulation and hardware.
fileSets:
  - name: RTL_Sources
    description: RTL Sources
    files:
      - path: rtl/regmap_conformance_axil_pkg.vhd
        type: vhdl
      - path: rtl/regmap_conformance_axil_regs.vhd
        type: vhdl
      - path: rtl/regmap_conformance_axil_core.vhd
        type: vhdl
        managed: false
      - path: rtl/regmap_conformance_axil_axil.vhd
        type: vhdl
      - path: rtl/regmap_conformance_axil.vhd
        type: vhdl
  - name: Simulation_Resources
    description: Simulation Files
    files:
      - path: tb/regmap_conformance_axil_test.py
        type: python
        managed: false
      - path: tb/test_regmap_conformance_axil_sim.py
        type: python
        managed: false
      - path: tb/conformance_scenarios.py
        type: python
        managed: false
  - name: Integration
    description: Integration Files
    files:
      - path: altera/regmap_conformance_axil_hw.tcl
        type: tcl
      - path: altera/debug/hardware_runner.py
        type: python
        managed: false
