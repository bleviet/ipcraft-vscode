vlnv:
  vendor: ipcraft-examples
  library: peripherals
  name: led_controller_avmm
  version: 1.0.0
apiVersion: '1.2'

description: Avalon-MM peripheral for the DE10-Nano LED demo. Drives 8 board
  LEDs from a software-writable pattern register.
clocks:
  - name: clk
    frequency: 50MHz
    associatedReset: reset
resets:
  - name: reset
    polarity: activeHigh
    logicalName: RESET
    associatedClock: clk
ports:
  - name: led
    direction: out
    width: 8
busInterfaces:
  - name: S_AVMM
    type: ipcraft:busif:avalon_mm:1.0
    mode: slave
    physicalPrefix: avs_
    associatedClock: clk
    associatedReset: reset
    useOptionalPorts:
      - read
      - write
      - writedata
      - readdata
      - address
      - byteenable
    portWidthOverrides:
      address: 2
    memoryMapRef: LED_AVMM_CSR
memoryMaps:
  - name: LED_AVMM_CSR
    import: led_controller_avmm.mm.yml
scaffold_pack: example-with-docs
fileSets:
  - name: RTL_Sources
    description: RTL Sources
    files:
      - path: rtl/led_controller_avmm_pkg.vhd
        type: vhdl
      - path: rtl/led_controller_avmm_regs.vhd
        type: vhdl
      - path: rtl/led_controller_avmm_core.vhd
        type: vhdl
      - path: rtl/led_controller_avmm_avmm.vhd
        type: vhdl
      - path: rtl/led_controller_avmm.vhd
        type: vhdl
  - name: Simulation_Resources
    description: Simulation Files
    files:
      - path: tb/register_model.py
        type: python
      - path: tb/led_controller_avmm_test.py
        type: python
      - path: tb/conftest.py
        type: python
      - path: tb/test_led_controller_avmm_sim.py
        type: python
      - path: tb/Makefile
        type: unknown
  - name: Integration
    description: Integration Files
    files:
      - path: altera/led_controller_avmm_hw.tcl
        type: tcl
      - path: altera/led_controller_avmm_project.tcl
        type: tcl
