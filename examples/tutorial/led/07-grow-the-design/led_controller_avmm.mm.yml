- name: LED_AVMM_CSR
  description: Description of this memory map
  addressBlocks:
    - name: CSR
      offset: 0
      usage: register
      defaultRegWidth: 32
      registers:
        - name: VERSION
          offset: 0
          access: read-write
          description: "IP version"
          fields:
            - name: MINOR
              bits: "[7:0]"
              access: read-only
            - name: MAJOR
              bits: "[15:8]"
              access: read-only
              resetValue: 1
        - name: LED_PATTERN
          offset: 4
          description: "LED output pattern"
          fields:
            - name: PATTERN
              bits: "[7:0]"
              access: read-write
              resetValue: 0
              description: "Bit N drives LED[N]"
