apiVersion: '1.3'
scaffold_pack: builtin-ipcraft
vlnv:
  vendor: ipcraft-test
  library: fixtures
  name: cocotb_64bit_axil
  version: 1.0.0
description: >
  AXI4-Lite slave with 64-bit data and a register field wider than 32 bits
  (ipcraft-vscode#321).
clocks:
  - name: clk
    logicalName: CLK
    direction: in
    associatedReset: reset_n
resets:
  - name: reset_n
    logicalName: RESET_N
    direction: in
    polarity: activeLow
    associatedClock: clk
busInterfaces:
  - name: S_AXI_LITE
    type: ipcraft:busif:axi4_lite:1.0
    mode: slave
    physicalPrefix: s_axil_
    associatedClock: clk
    associatedReset: reset_n
    memoryMapRef: CSR_MAP
    portWidthOverrides:
      AWADDR: 8
      ARADDR: 8
      WDATA: 64
      RDATA: 64
      WSTRB: 8
memoryMaps:
  - name: CSR_MAP
    import: wide_fields.mm.yml
