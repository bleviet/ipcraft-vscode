apiVersion: '1.3'
scaffold_pack: builtin-ipcraft
vlnv:
  vendor: ipcraft-test
  library: fixtures
  name: cocotb_64bit_avmm
  version: 1.0.0
description: >
  Avalon-MM slave with 64-bit data and a register field wider than 32 bits
  (ipcraft-vscode#321).
clocks:
  - name: clk
    frequency: 50MHz
    associatedReset: reset
resets:
  - name: reset
    polarity: activeHigh
    logicalName: RESET
    associatedClock: clk
busInterfaces:
  - name: S_AVMM
    type: ipcraft:busif:avalon_mm:1.0
    mode: slave
    physicalPrefix: avs_
    associatedClock: clk
    associatedReset: reset
    useOptionalPorts:
      - read
      - write
      - writedata
      - readdata
      - address
      - byteenable
    portWidthOverrides:
      address: 8
      writedata: 64
      readdata: 64
      byteenable: 8
    memoryMapRef: CSR_MAP
memoryMaps:
  - name: CSR_MAP
    import: wide_fields.mm.yml
