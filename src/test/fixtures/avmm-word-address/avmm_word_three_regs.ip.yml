apiVersion: '1.2'
scaffold_pack: builtin-ipcraft
vlnv:
  vendor: ipcraft-test
  library: fixtures
  name: avmm_word_three_regs
  version: 1.0.0
description: >
  Avalon-MM slave regression fixture (word-addressed, three registers: addr_width is 4).
clocks:
  - name: clk
    frequency: 50MHz
    associatedReset: reset
resets:
  - name: reset
    polarity: activeHigh
    logicalName: RESET
    associatedClock: clk
busInterfaces:
  - name: S_AVMM
    type: ipcraft:busif:avalon_mm:1.0
    mode: slave
    physicalPrefix: avs_
    associatedClock: clk
    associatedReset: reset
    useOptionalPorts:
      - read
      - write
      - writedata
      - readdata
      - address
      - byteenable
    portWidthOverrides:
      address: 2
    memoryMapRef: CSR_MAP
memoryMaps:
  - name: CSR_MAP
    import: three_regs.mm.yml
