apiVersion: '1.2'
scaffold_pack: builtin-ipcraft
vlnv:
  vendor: ipcraft-test
  library: fixtures
  name: avmm_byte_two_regs_8
  version: 1.0.0
description: >
  Avalon-MM slave regression fixture (8-bit data, so a 1-bit byteenable that is a scalar std_logic port).
clocks:
  - name: clk
    frequency: 50MHz
    associatedReset: reset
resets:
  - name: reset
    polarity: activeHigh
    logicalName: RESET
    associatedClock: clk
busInterfaces:
  - name: S_AVMM
    type: ipcraft:busif:avalon_mm:1.0
    mode: slave
    physicalPrefix: avs_
    associatedClock: clk
    associatedReset: reset
    useOptionalPorts:
      - read
      - write
      - writedata
      - readdata
      - address
      - byteenable
    portWidthOverrides:
      writedata: 8
      readdata: 8
      byteenable: 1
    memoryMapRef: CSR_MAP
memoryMaps:
  - name: CSR_MAP
    import: two_regs_8.mm.yml
